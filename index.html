<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&family=Outfit:wght@100..900&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>

</head>

<body>
    <div class="container">

        <div class="info">
            <h2>Generate a <br><span>random password</span></h2>
            <p>Never use an insecure password again.</p>
        </div>
        
        <button class="generate-btn"  onclick="generatePass()">
            Generate passwords
        </button>

        <hr>

        <div class="random-pass">
            <div class="password" id="generate-el"></div>
            <div class="password" id="generatetwo-el"></div>
        </div>

        <button class="reset-btn" id="reset-el" onclick="reset()">
            Reset
        </button>

    </div>
    <script src="index.js"></script>

</body>
</html>
